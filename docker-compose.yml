services:
  mujoco:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mujoco_arm_lab

    working_dir: /workspace

    volumes:
      # Windows 프로젝트 폴더 전체를 컨테이너 /workspace에 연결
      - .:/workspace

    environment:
      # 화면 없이 렌더링할 때 안정적인 방식
      # 나중에 이미지/영상 저장 실습에서 사용
      - MUJOCO_GL=osmesa

      # Python 로그를 즉시 출력
      - PYTHONUNBUFFERED=1

    stdin_open: true
    tty: true